name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The OpenTUI adapter is tested with Bun.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Node 26 comes without it.
      - name: Enable Corepack
        run: npm install --global corepack@0.36.0 && corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Type checks, lint and tests are dependencies of the build.
      - name: Build
        run: yarn build

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck docs
        run: yarn workspace @navios/commander-docs typecheck

      # A broken link or anchor fails the build.
      - name: Build docs
        run: yarn workspace @navios/commander-docs build
